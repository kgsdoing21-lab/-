<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>20기 장로 송년모임</title>
<style>
@page { size: A4; margin: 0; }
html,body{margin:0;padding:0}
body{font-family:"Noto Serif KR",serif;color:#3a2a1a;background:#fff}
.page{width:210mm;height:297mm;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#fff8ec 0%,#fff3df 55%,#ffe9cc 100%)}
.sun{position:absolute;top:-70mm;left:50%;transform:translateX(-50%);width:200mm;height:200mm;border-radius:50%;
  background:radial-gradient(circle,#ffe7a8 0%,#ffd98a 35%,rgba(255,217,138,0) 70%)}
.frame{position:absolute;inset:12mm;border:1.2mm solid #e8b04a;border-radius:6mm}
.frame2{position:absolute;inset:15mm;border:0.4mm solid #e8b04a;border-radius:4mm}
.content{position:absolute;inset:24mm 22mm;text-align:center;display:flex;flex-direction:column;align-items:center}
.top{font-size:13pt;letter-spacing:5px;color:#c0392b;font-weight:700;margin-top:10mm}
.eyebrow{display:inline-block;margin-top:8mm;padding:2.5mm 8mm;border-radius:20mm;background:#c0392b;color:#fff;font-size:15pt;font-weight:700;letter-spacing:2px}
h1{font-size:50pt;line-height:1.15;margin:8mm 0 2mm;color:#2f5d3a;letter-spacing:2px}
h1 span{color:#c0392b}
.sub{font-size:13.5pt;color:#7a5a32;margin-bottom:10mm}
.deco{font-size:22pt;color:#e8b04a;letter-spacing:8px;margin:2mm 0 8mm}
.info{width:100%;box-sizing:border-box;background:#ffffffd9;border-radius:5mm;box-shadow:0 1.5mm 4mm rgba(200,140,50,.18);padding:9mm 10mm;text-align:left}
.row{display:flex;align-items:flex-start;gap:6mm;padding:4mm 0;border-bottom:0.3mm dashed #ecc98a}
.row:last-child{border-bottom:0}
.lab{flex:0 0 26mm;background:#2f5d3a;color:#fff;text-align:center;border-radius:3mm;padding:2mm 0;font-weight:700;font-size:14pt}
.val{font-size:17pt;font-weight:700;line-height:1.45}
.val small{display:block;font-size:12pt;font-weight:400;color:#6b5236}
.val .hl{color:#c0392b}
.msg{margin-top:11mm;font-size:13.5pt;line-height:1.75;color:#5a4128}
.foot{position:absolute;bottom:22mm;left:0;right:0;text-align:center;font-size:12pt;color:#8a6a3c;letter-spacing:2px}
.snow{position:absolute;color:#f0c46b;opacity:.8}
</style>
</head>
<body>
<div class="page">
  <div class="sun"></div>
  <div class="frame"></div><div class="frame2"></div>
  <div class="snow" style="top:30mm;left:28mm;font-size:20pt">✦</div>
  <div class="snow" style="top:52mm;right:30mm;font-size:16pt">❄</div>
  <div class="snow" style="top:96mm;left:24mm;font-size:13pt">❄</div>
  <div class="snow" style="top:118mm;right:26mm;font-size:22pt">✦</div>
  <div class="snow" style="bottom:46mm;left:30mm;font-size:16pt">✦</div>
  <div class="snow" style="bottom:58mm;right:32mm;font-size:13pt">❄</div>

  <div class="content">
    <div class="top">SEASON'S GREETINGS · 2026</div>
    <div class="eyebrow">20기 장로</div>
    <h1><span>송년</span>모임</h1>
    <div class="sub">한 해 동안 함께해 주신 은혜에 감사드리며</div>
    <div class="deco">✦ ❄ ✦</div>

    <div class="info">
      <div class="row"><div class="lab">일 시</div><div class="val"><span class="hl">2026. 12. 5.(토)</span> 오전 11:30</div></div>
      <div class="row"><div class="lab">장 소</div><div class="val">소곤면옥 양천향교본점<small>서울 강서구 양천로47길 20<br>☎ 0507-1459-8329</small></div></div>
      <div class="row"><div class="lab">오시는 길</div><div class="val">9호선 양천향교역 1번 출구<small>출구에서 418m · 도보 약 6분</small></div></div>
    </div>

    <div class="msg">
      올 한 해 섬김의 자리를 지켜 오신 장로님들과<br>
      따뜻한 식탁에서 감사와 교제를 나누고자 합니다.<br>
      <b>귀한 걸음으로 함께해 주시기 바랍니다.</b>
    </div>
  </div>
  <div class="foot">경향교회 20기 장로회</div>
</div>
</body>
</html>
